<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
	 <meta name="viewport" content="width=device-width ,  initial_scale=1.0">
	 <title>Leaflet Map with Tools</title>
	 <!--Leaflet CSS-->
	 <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"  />
	 <!-- Leaflet Draw CSS -->
	 <link rel="stylesheet"
	 href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
	  <!-- Leaflet Search CSS -->
	 <link rel="stylesheet"
	 href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
	 <style>
	    #map {
		   height:600px; /*Set the height of the map */
		   width: 100%; /*Set the width of the map */
		}
	 </style>
</head>
<body>
	 <h1> Leaflet Map with Tools</h1>
	 <div id="map"></div>
	 <!--Leaflet JS-->
	 <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
	 <!--Leaflet Draw JS-->
	 <script 
	 src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
	 <!--Leaflet Search JS-->
	 <script
	 src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
	 <script>
	 
	     var map = L.map('map'). setView([51.505, -0.09], 13);
		 
		 var osmLayer = L.titleLayer ('https://{s}.title.openstreetmap.org/{z}/{x}/{y}.png' , {attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
		 
		 var satelliteLayer = L.titleLayer ('https://{s}.title.opentopomap.org/{z}/{x}/{y}.png' , {attribution: 'Map data: <a href="https://www.opentopomap.org">OpenTopoMap</a> contributors'}); 
		 
		 var baseMaps = {
		     "OpenStreetMap": osmLayer,
			 "Satellite": satelliteLayer
		 };
		 L.control.layers(baseMaps).addTo(map);
		 
		 L.control.scale().addTo(map);
		 
		 var drawnItems = new L.FeatureGroup();
		 map.addLayer(drawnItems);
		 
		 var drawControl = new L.Control.Draw({
		 edit:{
		     featureGroup: drawnItems
		}
});
map.addControl(drawControl);

map.on(L.Draw.Event.CREATED, function (event) {
    var layer = event.layer;
	drawnItems.addLayer (layer);
});		 

L.Control.geocoder().addTo(map);

function onMapClick(e) {
    var coord = e.latlng;
	var lat = coord.lat;
    var lng = coord.lng;
    alert("You clicked the map at latitude: " + lat + " and longitude: " + lng);
}
   map.on('click', onMapClick);
  </script>
</body>
</html>
